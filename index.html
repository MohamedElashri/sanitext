<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaniText - Text Sanitization Tool</title>
    <meta name="description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    <meta name="keywords" content="text sanitization, homoglyph detection, character cleaning, text security, unicode sanitizer">
    <meta name="author" content="Mohamed Elashri">
    <link rel="canonical" href="https://melashri.net/sanitext">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SaniText - Text Sanitization Tool">
    <meta property="og:description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    <meta property="og:url" content="https://melashri.net/sanitext">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SaniText - Text Sanitization Tool">
    <meta name="twitter:description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <a class="skip-link" href="#inputText">Skip to text editor</a>
    <header class="site-header">
        <div class="site-width header-inner">
            <a class="brand" href="index.html" aria-current="page">SaniText</a>
            <nav class="site-nav" aria-label="Main">
                <a href="pages/about.html">About</a>
                <a href="pages/privacy.html">Privacy</a>
                <a href="https://github.com/MohamedElashri/sanitext" target="_blank" rel="noopener noreferrer">GitHub</a>
            </nav>
        </div>
    </header>

    <main class="site-width workspace">
        <div class="workspace-heading">
            <h1>Text sanitizer</h1>
            <details class="settings" id="settings">
                <summary>Settings</summary>
                <div class="settings-options">
                    <label><input type="checkbox" id="allowEmoji"> Allow emoji</label>
                    <label><input type="checkbox" id="interactiveMode"> Interactive mode</label>
                    <label><input type="checkbox" id="verboseMode"> Verbose mode</label>
                </div>
            </details>
        </div>

        <div class="editors">
            <div class="editor">
                <div class="editor-header">
                    <label for="inputText">Input</label>
                    <div class="editor-tools">
                        <button type="button" class="button button-quiet" id="pasteBtn">Paste</button>
                        <input type="file" id="loadInputFile" hidden>
                        <button type="button" class="button button-quiet" id="openFileBtn">Open file</button>
                    </div>
                </div>
                <textarea id="inputText" placeholder="Enter or paste text…" spellcheck="false" autocomplete="off" autocapitalize="off" dir="auto"></textarea>
                <div class="editor-meta">
                    <span id="inputCount">0 characters</span>
                    <button type="button" class="button button-quiet" id="clearBtn" hidden>Clear</button>
                </div>
            </div>

            <div class="workspace-actions">
                <button type="button" class="button button-quiet" id="exampleBtn">Try an example</button>
                <div class="primary-actions">
                    <button type="button" class="button button-secondary" id="detectBtn">Detect only</button>
                    <button type="button" class="button button-primary" id="sanitizeBtn" aria-keyshortcuts="Control+Enter Meta+Enter">Sanitize text</button>
                </div>
            </div>

            <div class="editor output-editor">
                <div class="editor-header">
                    <label for="outputText">Output</label>
                    <button type="button" class="button button-quiet" id="copyBtn" disabled>Copy</button>
                </div>
                <textarea id="outputText" readonly spellcheck="false" dir="auto"></textarea>
                <div class="editor-meta"><span id="outputCount">0 characters</span></div>
            </div>
        </div>

        <section class="findings" id="detectedInfo" aria-label="Detection results" hidden>
            <h2 id="findingsTitle" tabindex="-1"></h2>
            <ul id="findingsList" class="findings-list" hidden></ul>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-atomic="true"></div>

    <dialog id="interactivePrompt" class="interactive-prompt" aria-labelledby="prompt-title" aria-describedby="charInfo">
        <div class="prompt-header">
            <h2 id="prompt-title">Review character</h2>
            <button type="button" id="closePromptBtn" class="button button-quiet" aria-label="Cancel sanitization">Cancel</button>
        </div>
        <div class="character-preview" id="charInfo">
            <span class="character-glyph" id="promptGlyph" aria-hidden="true"></span>
            <div><code id="promptCode"></code><p id="promptName"></p></div>
        </div>
        <p class="prompt-description">Choose what happens to every occurrence of this character.</p>
        <div class="decision-buttons">
            <button type="button" class="button button-secondary" id="keepBtn" autofocus>Keep</button>
            <button type="button" class="button button-secondary" id="removeBtn">Remove</button>
            <button type="button" class="button button-primary" id="replaceBtn">Replace</button>
        </div>
        <form id="replacementInput" class="replacement-input" hidden>
            <label for="replacementChar">Replacement text</label>
            <div class="replacement-controls">
                <input type="text" id="replacementChar" autocomplete="off" spellcheck="false">
                <button type="submit" class="button button-primary">Confirm</button>
            </div>
        </form>
    </dialog>

    <script src="js/homoglyph_map.js"></script>
    <script src="js/emoji_set.js"></script>
    <script src="js/sanitext.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
