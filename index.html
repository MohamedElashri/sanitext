<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaniText - Text Sanitization Tool</title>
    <meta name="description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    <meta name="keywords" content="text sanitization, homoglyph detection, character cleaning, text security, unicode sanitizer">
    <meta name="author" content="Mohamed Elashri">
    <link rel="canonical" href="https://melashri.net/sanitext">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="SaniText - Text Sanitization Tool">
    <meta property="og:description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    <meta property="og:url" content="https://melashri.net/sanitext">
    <meta property="og:type" content="website">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="SaniText - Text Sanitization Tool">
    <meta name="twitter:description" content="A browser-based tool for detecting and removing potentially problematic characters from text.">
    
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <div id="header-placeholder"></div>
        
        <div class="main-content">
            <div class="input-section">
                <h2>Input Text</h2>
                <div class="option">
                    <label for="loadInputFile">Load text from file:</label>
                    <input type="file" id="loadInputFile" accept="*/*">
                </div>
                <textarea id="inputText" placeholder="Enter or paste text to sanitize..."></textarea>
                <div class="button-group">
                    <button id="pasteBtn">Paste from Clipboard</button>
                    <button id="detectBtn">Detect Only</button>
                    <button id="sanitizeBtn">Sanitize Text</button>
                </div>
            </div>
            
            <div class="options-section">
                <h2>Options</h2>
                <div class="option">
                    <input type="checkbox" id="allowEmoji">
                    <label for="allowEmoji">Allow Emoji</label>
                </div>
                <div class="option">
                </div>
                <div class="option">
                    <input type="checkbox" id="interactiveMode">
                    <label for="interactiveMode">Interactive Mode</label>
                </div>
                <div class="option">
                    <input type="checkbox" id="verboseMode">
                    <label for="verboseMode">Verbose Mode</label>
                </div>
            </div>
            
            <div class="output-section">
                <h2>Output</h2>
                <div id="detectedInfo" class="detected-info"></div>
                <textarea id="outputText" readonly placeholder="Sanitized text will appear here..."></textarea>
                <button id="copyBtn">Copy to Clipboard</button>
            </div>
        </div>
        
        <div id="interactivePrompt" class="interactive-prompt">
            <div class="prompt-content">
                <div class="prompt-header">
                    <h3>Character Decision</h3>
                    <button id="closePromptBtn" class="close-btn">&times;</button>
                </div>
                <p id="charInfo"></p>
                <div class="decision-buttons">
                    <button id="keepBtn">Keep</button>
                    <button id="removeBtn">Remove</button>
                    <button id="replaceBtn">Replace</button>
                </div>
                <div id="replacementInput" class="replacement-input">
                    <input type="text" id="replacementChar" placeholder="Enter replacement character(s)">
                    <button id="confirmReplaceBtn">Confirm</button>
                </div>
            </div>
        </div>
        <div id="footer-placeholder"></div>
    </div>
    
    <script src="/js/homoglyph_map.js"></script>
    <script src="/js/emoji_set.js"></script>
    <script src="/js/sanitext.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/common.js"></script>
</body>
</html>
